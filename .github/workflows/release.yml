name: Release macOS

on:
  push:
    tags: ['hub-v*']

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build dependencies
        run: brew install pkg-config libusb
      - name: Test
        run: go test ./...
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
      - name: Build release archive
        run: ./scripts/package-macos-arm64.sh "${GITHUB_REF_NAME#hub-}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#hub-}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/release/DJ-4G-Hub-macOS-arm64-${version}.zip" \
            "dist/release/DJ-4G-Hub-macOS-arm64-${version}.zip.sha256" \
            --generate-notes \
            --title "DJ 4G Hub ${version}"
